
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>DoisLisos | Assista no YouTube</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: white;
      background: #111;
      text-align: center;
    }

    main { max-width: 420px; width: 100%; }

    .logo {
      font-size: 48px;
      margin-bottom: 12px;
    }

    h1 { font-size: 30px; margin-bottom: 12px; }

    p {
      color: #ccc;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    a {
      display: block;
      padding: 17px;
      margin: 14px 0;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      text-decoration: none;
    }

    .youtube {
      background: #ff0033;
      color: white;
    }

    .browser {
      background: white;
      color: #111;
    }

    small { color: #999; line-height: 1.5; }
  </style>
</head>

<body>
  <main>
    <div class="logo">▶️</div>
    <h1>DoisLisos</h1>

    <p>
      🌎 Vem viajar com a gente!<br>
      Assista aos nossos vídeos e inscreva-se no canal.
    </p>

    <a class="youtube"
       href="https://youtu.be/K1ynbdgt2hs"
       target="_blank"
       rel="noopener noreferrer">
      ▶ Assistir no YouTube
    </a>

    <a class="browser"
       href="https://www.youtube.com/@Doislisos">
      Assistir pelo navegador
    </a>

    <small>
      Se o aplicativo não abrir, escolha a opção de assistir pelo navegador.
    </small>
  </main>
</body>
</html>
